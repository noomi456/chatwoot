name: Build ChatRing Conversation Core

on:
  push:
    branches:
      - codex/chatring-ce-foundation
      - codex/internal-assistant-spike
      - codex/rag-production-fix
      - codex/phase2a-final-audit
      - codex/phase2a-lifecycle-hardening
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chatring-conversation-core

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pinned ChatRing CE source
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        run: pnpm run eslint

      - name: Run ChatRing branding tests
        run: pnpm exec vitest app/javascript/shared/helpers/specs/InstallationBranding.spec.js --run --no-cache

  validate-knowledge:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout pinned ChatRing CE source
        uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Strip proprietary Enterprise source
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Prepare isolated test database
        # Chatwoot's checked-in schema is the supported fresh-database baseline.
        # Replaying historical migrations fails because some of them reference
        # application/gem constants that no longer exist. Load that baseline,
        # then apply only migrations newer than its recorded version.
        run: bundle exec rails db:create db:schema:load db:migrate
        env:
          RAILS_ENV: test
          REDIS_URL: redis://localhost:6379/0

      - name: Run Phase 2A contract tests
        run: >-
          bundle exec rspec
          spec/configs/schedule_spec.rb
          spec/jobs/chat_ring/assistant_spike/response_job_spec.rb
          spec/models/chat_ring/knowledge_document_spec.rb
          spec/models/chat_ring/knowledge/scope_cleanup_spec.rb
          spec/models/chat_ring/knowledge_version_spec.rb
          spec/jobs/chat_ring/knowledge/provider_cleanup_job_spec.rb
          spec/jobs/chat_ring/knowledge/lifecycle_reconciliation_job_spec.rb
          spec/jobs/chat_ring/knowledge/provider_maintenance_job_spec.rb
          spec/services/chat_ring/knowledge/docs_gpt_client_spec.rb
          spec/services/chat_ring/knowledge/docs_gpt_provider_spec.rb
          spec/services/chat_ring/knowledge/evaluation_service_spec.rb
          spec/services/chat_ring/knowledge/firecrawl_client_spec.rb
          spec/services/chat_ring/knowledge/markdown_structure_spec.rb
          spec/services/chat_ring/knowledge/source_policy_spec.rb
          spec/services/chat_ring/knowledge/sync_service_spec.rb
          spec/services/chat_ring/knowledge/publication_service_spec.rb
          spec/services/chat_ring/knowledge/provider_chunk_validator_spec.rb
          spec/services/chat_ring/knowledge/provider_validator_spec.rb
          spec/services/chat_ring/knowledge/provider_cleanup_scheduler_spec.rb
          spec/services/chat_ring/knowledge/provider_cleanup_reconciler_spec.rb
          spec/services/chat_ring/knowledge/abandonment_service_spec.rb
          spec/services/chat_ring/knowledge/retriever_spec.rb
        env:
          RAILS_ENV: test
          REDIS_URL: redis://localhost:6379/0

      - name: Run Phase 2A Ruby lint
        run: >-
          bundle exec rubocop
          app/models/concerns/chat_ring/assistant_spike
          app/models/chat_ring
          app/models/concerns/chat_ring/knowledge
          app/services/chat_ring/assistant_spike
          app/services/chat_ring/knowledge
          app/services/chat_ring/assistant_spike.rb
          app/jobs/chat_ring/assistant_spike
          app/jobs/chat_ring/knowledge
          config/initializers/chat_ring_assistant_spike.rb
          config/initializers/chat_ring_knowledge_cleanup.rb
          lib/tasks/chat_ring_knowledge.rake
          db/migrate/20260805000000_create_chat_ring_knowledge_foundation.rb
          db/migrate/20260805001000_harden_chat_ring_knowledge_lifecycle.rb
          db/migrate/20260806000000_add_chat_ring_provider_cleanup_records.rb
          db/migrate/20260806001000_harden_chat_ring_knowledge_scope_deletion.rb
          db/migrate/20260806002000_harden_chat_ring_knowledge_recovery.rb
          spec/models/chat_ring
          spec/configs/schedule_spec.rb
          spec/jobs/chat_ring/assistant_spike
          spec/jobs/chat_ring/knowledge
          spec/services/chat_ring/knowledge

      - name: Validate private DocsGPT deployment contract
        env:
          DOCSGPT_IMAGE: example/docsgpt@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CHATRING_CORE_NETWORK: chatring-core
          DOCSGPT_POSTGRES_URI: postgresql://docsgpt:password@postgres:5432/docsgpt
          DOCSGPT_PGVECTOR_CONNECTION_STRING: postgresql://docsgpt:password@postgres:5432/docsgpt
          DOCSGPT_CELERY_BROKER_URL: redis://:password@redis:6379/3
          DOCSGPT_CELERY_RESULT_BACKEND: redis://:password@redis:6379/4
          DOCSGPT_CACHE_REDIS_URL: redis://:password@redis:6379/5
          DOCSGPT_INTERNAL_KEY: ci-only-internal-key
          DOCSGPT_JWT_SECRET: ci-only-jwt-secret-with-sufficient-entropy
          DOCSGPT_SERVICE_SECRET: ci-only-service-secret-with-sufficient-entropy
        run: |
          docker compose -f deploy/knowledge/compose.yml config --quiet
          docker compose -f deploy/knowledge/compose.yml config --format json > /tmp/chatring-knowledge-compose.json
          jq -e '.services | all(.ports == null)' /tmp/chatring-knowledge-compose.json
          jq -e '.services["docs-gpt-volume-init"].network_mode == "none"' /tmp/chatring-knowledge-compose.json
          jq -e '.services["docs-gpt-volume-init"].user == "0:0"' /tmp/chatring-knowledge-compose.json
          jq -e '.services["docs-gpt-backend"].environment.INTERNAL_KEY == "ci-only-internal-key"' /tmp/chatring-knowledge-compose.json
          jq -e '.services["docs-gpt-worker"].environment.INTERNAL_KEY == "ci-only-internal-key"' /tmp/chatring-knowledge-compose.json
          jq -e '.services["docs-gpt-backend"].environment.AUTH_TYPE == "simple_jwt"' /tmp/chatring-knowledge-compose.json
          jq -e '.services["docs-gpt-backend"].environment.WSGI_THREADPOOL_WORKERS == "12"' /tmp/chatring-knowledge-compose.json
          jq -e '.services["docs-gpt-worker"].command | contains(["--concurrency=1", "--max-tasks-per-child=20"])' /tmp/chatring-knowledge-compose.json
          grep -q 'DocsGPT JWT startup-log contract changed' deploy/knowledge/Dockerfile
          grep -q 'Simple JWT authentication initialized' deploy/knowledge/Dockerfile
          grep -q 'request.headers.get("X-Internal-Key"' deploy/knowledge/docsgpt/chatring_extension.py
          grep -q '_internal_key(), provided_internal_key' deploy/knowledge/docsgpt/chatring_extension.py
          grep -q 'MarkdownParser.parse_file = _chatring_markdown_parse_file' deploy/knowledge/docsgpt/chatring_extension.py
          grep -q 'classic_rag_module.labels_from_metadata = _chatring_labels_from_metadata' deploy/knowledge/docsgpt/chatring_extension.py
          grep -q 'DEFAULT_EVIDENCE_LIMIT = 8' deploy/knowledge/docsgpt/chatring_extension.py
          ! grep -q '_row_lookup' deploy/knowledge/docsgpt/chatring_extension.py
          python -m py_compile deploy/knowledge/docsgpt/chatring_extension.py

  validate-knowledge-image:
    needs: [validate, validate-knowledge]
    runs-on: ubuntu-22.04
    env:
      DOCSGPT_SOURCE_COMMIT: 616e6fe9c435bbc6bb472636db6b3ee2b9bcaf66
      DOCSGPT_BASE_IMAGE: chatring/docsgpt-upstream:616e6fe9c435bbc6bb472636db6b3ee2b9bcaf66
      DOCSGPT_DERIVED_IMAGE: chatring/docsgpt-ci:${{ github.sha }}
      DOCSGPT_PUBLISHED_IMAGE: ghcr.io/${{ github.repository_owner }}/chatring-docsgpt:sha-${{ github.sha }}
    steps:
      - name: Checkout pinned ChatRing CE source
        uses: actions/checkout@v4

      - name: Checkout exact DocsGPT source
        uses: actions/checkout@v4
        with:
          repository: arc53/DocsGPT
          ref: ${{ env.DOCSGPT_SOURCE_COMMIT }}
          path: docsgpt-upstream

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact upstream DocsGPT image
        id: upstream
        uses: docker/build-push-action@v6
        with:
          context: docsgpt-upstream/application
          file: docsgpt-upstream/application/Dockerfile
          load: true
          push: false
          tags: ${{ env.DOCSGPT_BASE_IMAGE }}
          cache-from: type=gha,scope=docsgpt-upstream
          cache-to: type=gha,mode=max,scope=docsgpt-upstream

      - name: Build ChatRing-derived DocsGPT image
        run: |
          # The exact upstream image was source-built and loaded into this job's
          # Docker daemon above. Use that local tag here; appending its digest to
          # an unpushed tag makes Buildx incorrectly attempt a Docker Hub pull.
          docker build \
            --file deploy/knowledge/Dockerfile \
            --tag "${DOCSGPT_DERIVED_IMAGE}" \
            --build-arg "DOCSGPT_BASE_IMAGE=${DOCSGPT_BASE_IMAGE}" \
            --build-arg "DOCSGPT_SOURCE_REPOSITORY=https://github.com/arc53/DocsGPT" \
            --build-arg "DOCSGPT_SOURCE_COMMIT=${DOCSGPT_SOURCE_COMMIT}" \
            --build-arg "DOCSGPT_BASE_DIGEST=${{ steps.upstream.outputs.digest }}" \
            --build-arg "CHATRING_SOURCE_COMMIT=${GITHUB_SHA}" \
            .

      - name: Run functional tests inside the derived image
        run: >-
          docker run --rm
          --entrypoint python
          --env PYTHONPATH=/app
          --volume "$PWD/deploy/knowledge/docsgpt/chatring_extension_test.py:/tmp/chatring_extension_test.py:ro"
          "${DOCSGPT_DERIVED_IMAGE}"
          /tmp/chatring_extension_test.py

      - name: Verify immutable source labels
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "io.chatring.docsgpt.source_commit" }}' "${DOCSGPT_DERIVED_IMAGE}")" = "${DOCSGPT_SOURCE_COMMIT}"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.chatring.docsgpt.base_digest" }}' "${DOCSGPT_DERIVED_IMAGE}")" = "${{ steps.upstream.outputs.digest }}"
          test "$(docker image inspect --format '{{ index .Config.Labels "io.chatring.source_commit" }}' "${DOCSGPT_DERIVED_IMAGE}")" = "${GITHUB_SHA}"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish functionally tested DocsGPT image
        run: |
          docker tag "${DOCSGPT_DERIVED_IMAGE}" "${DOCSGPT_PUBLISHED_IMAGE}"
          docker push "${DOCSGPT_PUBLISHED_IMAGE}"

  build:
    needs: [validate, validate-knowledge, validate-knowledge-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned ChatRing CE source
        uses: actions/checkout@v4

      - name: Strip proprietary Enterprise source
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
          printf '\nENV CW_EDITION="ce"\nENV DISABLE_ENTERPRISE="true"\n' >> docker/Dockerfile

      - name: Verify Community Edition source boundary
        run: |
          test ! -e enterprise
          test ! -e spec/enterprise
          test -f app/javascript/dashboard/api/enterprise/account.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

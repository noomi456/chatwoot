x-chatring-app: &chatring-app
  image: ${CHATRING_IMAGE:?CHATRING_IMAGE must be an immutable full-commit image tag}
  environment: &chatring-environment
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?required}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?required}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?required}
    CW_EDITION: ce
    DISABLE_ENTERPRISE: "true"
    ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
    FORCE_SSL: ${FORCE_SSL:-true}
    FRONTEND_URL: ${FRONTEND_URL:?required}
    INSTALLATION_ENV: docker
    MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-ChatRing <accounts@chatring.ai>}
    NODE_ENV: production
    POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatring_conversation}
    POSTGRES_HOST: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    POSTGRES_PORT: "5432"
    POSTGRES_USERNAME: ${POSTGRES_USERNAME:-chatring}
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?required}
  volumes:
    - chatring_storage:/app/storage
  restart: unless-stopped

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatring_conversation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatring}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USERNAME:-chatring} -d ${POSTGRES_DATABASE:-chatring_conversation}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - chatring_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - chatring_redis:/data
    restart: unless-stopped

  prepare:
    <<: *chatring-app
    command:
      - bundle
      - exec
      - rails
      - db:chatwoot_prepare
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    restart: "no"

  rails:
    <<: *chatring-app
    command:
      - bundle
      - exec
      - rails
      - server
      - -p
      - "3000"
      - -b
      - 0.0.0.0
    depends_on:
      prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- --header='X-Forwarded-Proto: https' http://127.0.0.1:3000/health >/dev/null || exit 1"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    expose:
      - "3000"

  sidekiq:
    <<: *chatring-app
    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml
    depends_on:
      prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh

volumes:
  chatring_postgres:
  chatring_redis:
  chatring_storage:
